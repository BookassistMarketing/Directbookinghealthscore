# Amplify does not run ISR revalidation, so date-gated blog posts only appear
# after a fresh build. This pushes an empty commit to main every Monday morning
# (posts are dated Mondays), which triggers the Amplify build.
name: Weekly blog rebuild

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Push empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: weekly rebuild to publish dated blog posts"
          git push origin main
